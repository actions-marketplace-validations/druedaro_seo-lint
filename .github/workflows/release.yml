name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.1) — must match package.json version'
        required: true
        default: '0.1.1'

permissions:
  contents: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Validate version matches package.json
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            INPUT_VER="${TAG#v}"
          fi
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Requested: $INPUT_VER | package.json: $PKG_VER"
          if [ "$INPUT_VER" != "$PKG_VER" ]; then
            echo "ERROR: Requested version ($INPUT_VER) does not match package.json version ($PKG_VER)"
            echo "Update package.json before tagging a new release."
            exit 1
          fi
          echo "VERSION=${PKG_VER}" >> $GITHUB_OUTPUT

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER="${{ steps.version.outputs.VERSION }}"
          if npm view "${PKG_NAME}@${PKG_VER}" version > /dev/null 2>&1; then
            echo "Version ${PKG_VER} of ${PKG_NAME} is already published on npm. Skipping publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
