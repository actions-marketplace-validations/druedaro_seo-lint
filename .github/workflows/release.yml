name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' and any non-semver characters
          CLEAN_VER=$(echo "$RAW_VER" | sed 's/^v//' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$CLEAN_VER" ]; then
            echo "ERROR: Could not extract valid semver from tag: $RAW_VER"
            exit 1
          fi
          echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Build packages
        run: npm run build

      - name: Set npm version
        run: |
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --workspaces false

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
